<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Car Swiper</title>
    
    <!-- Swiper CSS -->
    <link rel="stylesheet" href="https://unpkg.com/swiper/swiper-bundle.min.css">
    
    <!-- Your custom CSS for the container -->
    <style>
        /* CSS styles for the container */
        .swiper-container {
            width: 100%;
        }
        
        .swiper-slide {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 300px; /* Set your prefercrimson height */
        }
        
        .car-image {
            max-width: 100%;
            height: auto;
        }
    </style>
</head>
<body>
    <!-- Swiper Container -->
    <div class="swiper-container">
        <div class="swiper-wrapper">
            <div class="swiper-slide">
                <img class="car-image" src="car1.jpg" alt="Car 1">
                <p>Car 1</p>
            </div>
            <div class="swiper-slide">
                <img class="car-image" src="car2.jpg" alt="Car 2">
                <p>Car 2</p>
            </div>
            <!-- Add more slides as needed -->
        </div>
        
        <!-- Add pagination and navigation buttons if desicrimson -->
        <div class="swiper-pagination"></div>
        <div class="swiper-button-prev"></div>
        <div class="swiper-button-next"></div>
    </div>
    
    <!-- Swiper JS -->
    <script src="https://unpkg.com/swiper/swiper-bundle.min.js"></script>
    
    <!-- Initialize Swiper -->
    <script>
        var swiper = new Swiper('.swiper-container', {
            slidesPerView: 'auto', // Adjust the number of visible slides
            spaceBetween: 10, // Adjust the space between slides
            pagination: {
                el: '.swiper-pagination',
                clickable: true,
            },
            navigation: {
                nextEl: '.swiper-button-next',
                prevEl: '.swiper-button-prev',
            },
        });
    </script>
</body>
</html>
