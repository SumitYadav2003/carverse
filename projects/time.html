<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Car Information</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f2f2f2;
        }

        header {
            background-color: #333;
            color: #fff;
            text-align: center;
            padding: 20px;
        }

        h1 {
            margin: 0;
        }

        .container5 {
            max-width: 800px;
            margin: 20px auto;
            background-color: #fff;
            padding: 20px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
        }

        .car-imaga {
            max-width: 100%;
            height: auto;
        }

        .car-infa {
            margin-top: 20px;
        }

        .car-infa h2 {
            font-size: 24px;
            color: #333;
        }

        .car-infa p {
            font-size: 16px;
            color: #666;
        }
    </style>
</head>
<body>
    <header>
        <h1>Car Information</h1>
    </header>
    <div class="container5">
        <img class="car-imaga" src="imagess/nissan.webp" alt="Car Image">
        <div class="car-infa">
            <h2>Car Model: Example Car</h2>
            <p>Manufacturer: ABC Motors</p>
            <p>Year: 2023</p>
            <p>Price: $30,000</p>
            <p>Color: Silver</p>
            <p>Description: Lorem ipsum dolor sit amet, consectetur adipiscing elit. Sed vehicula lacus nec ex vehicula, et laoreet elit lacinia.</p>
        </div>
    </div>
</body>
</html>
